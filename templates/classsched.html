<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Class Schedules</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../static/classsched.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='classsched.css') }}">
</head>
<body>

  <!-- Sidebar -->
    <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="header">
      <h2><i class="fas fa-calendar-alt"></i> Class Schedules</h2>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search class schedules...">
      </div>
    </div>

    <!-- Complete Schedule Form -->
    <div class="schedule-form">
      <form id="classScheduleForm">
        <!-- Horizontal Form Group with two rows -->
        <div class="horizontal-form-group">
          <!-- First Row: Program, Year & Section, Subject Code, Class Type -->
          <div class="form-row-1">
            <div class="form-field">
              <label for="program">
                <i class="fas fa-layer-group"></i> Program *
              </label>
              <select id="program" required>
                <option value="" disabled selected>Choose Program</option>
                <option value="CS">BS Computer Science</option>
                <option value="IT">BS Information Technology</option>
                <option value="ACT">Assistive in Computer Technology</option>
              </select>
            </div>
            <div class="form-field">
              <label for="yearSection">
                <i class="fas fa-layer-group"></i> Year & Section *
              </label>
              <select id="yearSection" required disabled>
                <option value="" disabled selected>Choose Year & Section</option>
              </select>
            </div>
            <div class="form-field">
              <label for="subjectCode">
                <i class="fas fa-tag"></i> Subject Code *
              </label>
              <select id="subjectCode" required disabled>
                <option value="" disabled selected>Select Subject Code</option>
              </select>
            </div>
            <div class="form-field">
              <label for="classType">
                <i class="fas fa-book-open"></i> Class Type *
              </label>
              <select id="classType" required disabled>
                <option value="" disabled selected>Select Class Type</option>
                <option value="Lecture">Lecture</option>
                <option value="Laboratory">Laboratory</option>
              </select>
            </div>
          </div>

          <!-- Second Row: Day, Start Time, End Time, Room -->
          <div class="form-row-2">
            <div class="form-field">
              <label for="scheduleDay">
                <i class="fas fa-calendar-day"></i> Day *
              </label>
              <select id="scheduleDay" required>
                <option value="" disabled selected>Select Day</option>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
              </select>
            </div>
            <div class="form-field">
              <label for="startTime">
                <i class="fas fa-clock"></i> Start Time *
              </label>
              <select id="startTime" required>
                <option value="" disabled selected>Start Time</option>
                <option value="7:00 AM">7:00 AM</option>
                <option value="7:30 AM">7:30 AM</option>
                <option value="8:00 AM">8:00 AM</option>
                <option value="8:30 AM">8:30 AM</option>
                <option value="9:00 AM">9:00 AM</option>
                <option value="9:30 AM">9:30 AM</option>
                <option value="10:00 AM">10:00 AM</option>
                <option value="10:30 AM">10:30 AM</option>
                <option value="11:00 AM">11:00 AM</option>
                <option value="11:30 AM">11:30 AM</option>
                <option value="12:00 PM">12:00 PM</option>
                <option value="12:30 PM">12:30 PM</option>
                <option value="1:00 PM">1:00 PM</option>
                <option value="1:30 PM">1:30 PM</option>
                <option value="2:00 PM">2:00 PM</option>
                <option value="2:30 PM">2:30 PM</option>
                <option value="3:00 PM">3:00 PM</option>
                <option value="3:30 PM">3:30 PM</option>
                <option value="4:00 PM">4:00 PM</option>
                <option value="4:30 PM">4:30 PM</option>
                <option value="5:00 PM">5:00 PM</option>
                <option value="5:30 PM">5:30 PM</option>
                <option value="6:00 PM">6:00 PM</option>
                <option value="6:30 PM">6:30 PM</option>
              </select>
            </div>
            <div class="form-field">
              <label for="endTime">
                <i class="fas fa-stopwatch"></i> End Time *
              </label>
              <select id="endTime" required>
                <option value="" disabled selected>End Time</option>
                <option value="8:00 AM">8:00 AM</option>
                <option value="8:30 AM">8:30 AM</option>
                <option value="9:00 AM">9:00 AM</option>
                <option value="9:30 AM">9:30 AM</option>
                <option value="10:00 AM">10:00 AM</option>
                <option value="10:30 AM">10:30 AM</option>
                <option value="11:00 AM">11:00 AM</option>
                <option value="11:30 AM">11:30 AM</option>
                <option value="12:00 PM">12:00 PM</option>
                <option value="12:30 PM">12:30 PM</option>
                <option value="1:00 PM">1:00 PM</option>
                <option value="1:30 PM">1:30 PM</option>
                <option value="2:00 PM">2:00 PM</option>
                <option value="2:30 PM">2:30 PM</option>
                <option value="3:00 PM">3:00 PM</option>
                <option value="3:30 PM">3:30 PM</option>
                <option value="4:00 PM">4:00 PM</option>
                <option value="4:30 PM">4:30 PM</option>
                <option value="5:00 PM">5:00 PM</option>
                <option value="5:30 PM">5:30 PM</option>
                <option value="6:00 PM">6:00 PM</option>
                <option value="6:30 PM">6:30 PM</option>
                <option value="7:00 PM">7:00 PM</option>
              </select>
            </div>
            <div class="form-field">
              <label for="room">
                <i class="fas fa-door-open"></i> Room *
              </label>
              <select id="room" required disabled>
                <option value="" disabled selected>Select Class Type First</option>
              </select>
            </div>
          </div>

          <!-- Add Schedule Button Row -->
          <div class="form-actions">
            <button type="button" class="btn btn-warning" id="addScheduleBtn" disabled>
              <i class="fas fa-plus"></i> Add Schedule
            </button>
          </div>
        </div>

        <!-- Pending Schedules Section -->
        <div class="form-section">
          <div class="pending-schedules" id="pendingSchedules" style="display: none;">
            <h5><i class="fas fa-clock"></i> Pending Schedules (<span id="pendingCount">0</span>)</h5>
            <ul class="pending-list" id="pendingList"></ul>
          </div>
        </div>

        <!-- Compact Form Actions -->
        <div class="form-actions">
          <button type="reset" class="btn" style="background: #6c757d; color: white;" id="resetBtn">
            <i class="fas fa-undo"></i> Reset All
          </button>
          <button type="button" class="btn btn-secondary" id="clearPendingBtn" style="display: none;">
            <i class="fas fa-trash"></i> Clear Pending
          </button>
          <button type="submit" class="btn btn-primary" id="saveAllBtn" disabled>
            <i class="fas fa-save"></i> Save All Schedules (<span id="totalPendingCount">0</span>)
          </button>
        </div>
      </form>
    </div>

    <!-- Compact Schedule Table -->
    <div class="schedule-table">
      <h3><i class="fas fa-list"></i> Class Schedule List</h3>
      <table id="classScheduleTable">
        <thead>
          <tr>
            <th>Year & Section</th>
            <th>Subject Code</th>
            <th>Subject</th>
            <th>Class Types</th>
            <th>Schedule</th>
            <th>Rooms</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Warning Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">Warning</h3>
      <p id="modalMessage"></p>
      <button id="closeModal">Close</button>
    </div>
  </div>

  <!-- Schedule Warning Modal -->
  <div class="warning-modal" id="scheduleWarningModal">
    <div class="warning-modal-content">
      <i class="fas fa-exclamation-triangle warning-icon"></i>
      <h3 id="warningTitle">Schedule Error</h3>
      <p id="scheduleErrorMessage">Class duration must be between 1 to 3 hours.</p>
      <button class="btn-close" onclick="closeWarningModal()">
        Adjust Schedule
      </button>
    </div>
  </div>

  <script>
    // Load sidebar
    console.log('Starting sidebar fetch...');
    
    fetch('/sidebar')
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
        })
        .then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
            
            // Initialize dropdown functionality
            document.querySelectorAll(".dropdown-btn").forEach(btn => {
                btn.addEventListener("click", function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    document.querySelectorAll('.dropdown-content').forEach(content => {
                        if (content !== this.nextElementSibling) {
                            content.style.display = 'none';
                        }
                    });

                    const content = this.nextElementSibling;
                    if (content) {
                        content.style.display = content.style.display === 'block' ? 'none' : 'block';
                    }
                });
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.dropdown')) {
                    document.querySelectorAll('.dropdown-content').forEach(content => {
                        content.style.display = 'none';
                    });
                }
            });

            const currentPath = window.location.pathname;
            document.querySelectorAll('.nav-items a').forEach(link => {
                const linkPath = link.getAttribute('href');
                if (currentPath.includes(linkPath) && linkPath !== '#') {
                    link.classList.add('active');
                    const dropdown = link.closest('.dropdown-content');
                    if (dropdown) {
                        dropdown.style.display = 'block';
                    }
                }
            });
        })
        .catch(error => {
            console.error('Sidebar fetch failed:', error);
            document.getElementById('sidebar-container').innerHTML = `
                <div style="color: red; padding: 20px;">
                    <h3>Sidebar Error</h3>
                    <p>Failed to load sidebar: ${error.message}</p>
                </div>
            `;
        });

    // Global variables
let currentProgramId = '';
let currentSectionId = null;
let currentAcademicYear = '';
let currentSemester = '';
let yearSectionsCache = {};
let subjectsCache = {};
let pendingSchedules = [];
let allSchedules = [];

    // DOM Elements
    const modalOverlay = document.getElementById('modalOverlay');
    const modalMessage = document.getElementById('modalMessage');
    const closeModal = document.getElementById('closeModal');
    const form = document.getElementById('classScheduleForm');
    const tableBody = document.querySelector('#classScheduleTable tbody');
    const programSelect = document.getElementById('program');
    const yearSectionSelect = document.getElementById('yearSection');
    const subjectCodeSelect = document.getElementById('subjectCode');
    const classTypeSelect = document.getElementById('classType');
    const scheduleDaySelect = document.getElementById('scheduleDay');
    const startTimeSelect = document.getElementById('startTime');
    const endTimeSelect = document.getElementById('endTime');
    const roomSelect = document.getElementById('room');
    const addScheduleBtn = document.getElementById('addScheduleBtn');
    const saveAllBtn = document.getElementById('saveAllBtn');
    const resetBtn = document.getElementById('resetBtn');
    const clearPendingBtn = document.getElementById('clearPendingBtn');
    const pendingSchedulesDiv = document.getElementById('pendingSchedules');
    const pendingList = document.getElementById('pendingList');
    const pendingCount = document.getElementById('pendingCount');
    const totalPendingCount = document.getElementById('totalPendingCount');

    // Room mapping based on class type
    const ROOM_MAPPING = {
        'lecture': ['LR1', 'LR2', 'LR3', 'LR4', 'LR5'],
        'laboratory': ['LAB1', 'LAB2', 'LAB3']
    };

    // Modal functions
    function showModal(message, title = "Notice") {
        document.getElementById('modalTitle').textContent = title;
        modalMessage.textContent = message;
        modalOverlay.style.display = 'flex';
    }

    closeModal.addEventListener('click', () => {
        modalOverlay.style.display = 'none';
    });

    window.closeWarningModal = function() {
        document.getElementById('scheduleWarningModal').style.display = 'none';
    };

    // Load programs and initialize
    document.addEventListener('DOMContentLoaded', function() {
        loadAllSchedules();
    });

// Program change handler
programSelect.addEventListener('change', function() {
    currentProgramId = this.value;
    if (currentProgramId) {
        loadActivePeriod();
    }
    resetDependentFields(['yearSection', 'subjectCode', 'classType', 'room']);
});

    // Year section change handler
    yearSectionSelect.addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        currentSectionId = selectedOption.dataset.sectionId;
        loadSubjects();
        resetDependentFields(['subjectCode', 'classType', 'room']);
    });

    // Subject code change handler
    subjectCodeSelect.addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        const subjectClassType = selectedOption.dataset.classType;
        
        // Populate class type based on subject
        classTypeSelect.innerHTML = '<option value="" disabled selected>-- Select Class Type --</option>';
        
        if (subjectClassType === 'both') {
            classTypeSelect.innerHTML += '<option value="lecture">Lecture</option>';
            classTypeSelect.innerHTML += '<option value="laboratory">Laboratory</option>';
        } else {
            classTypeSelect.innerHTML += `<option value="${subjectClassType}">${subjectClassType.charAt(0).toUpperCase() + subjectClassType.slice(1)}</option>`;
        }
        
        classTypeSelect.disabled = false;
        resetDependentFields(['room']);
    });

    // Class type change handler
    classTypeSelect.addEventListener('change', function() {
        populateRooms(this.value);
    });

    // Time validation
    startTimeSelect.addEventListener('change', validateTimeInputs);
    endTimeSelect.addEventListener('change', validateTimeInputs);

    // Form field change listeners for button state
    [programSelect, yearSectionSelect, subjectCodeSelect, classTypeSelect, 
     scheduleDaySelect, startTimeSelect, endTimeSelect, roomSelect].forEach(el => {
        if (el) el.addEventListener('change', updateAddScheduleButton);
    });

function loadActivePeriod() {
    if (!currentProgramId) {
        console.log('No program selected');
        return;
    }
    
    console.log('Loading active period for program:', currentProgramId);
    
    fetch(`/api/get_active_period?program_id=${currentProgramId}`)
        .then(response => response.json())
        .then(data => {
            console.log('Active period response:', data);
            
            if (data.success && data.active_period) {
                currentAcademicYear = data.active_period.academic_year;
                currentSemester = data.active_period.semester;
                console.log(`Loaded active period: ${currentAcademicYear} - ${currentSemester}`);
                loadYearSections();
            } else {
                console.error('No active period found:', data.message);
                showModal(
                    'No active academic year/semester set for this program.\n\n' +
                    'Please go to the Programs page and:\n' +
                    '1. Click on the program\n' +
                    '2. Add an academic year if none exists\n' +
                    '3. Add semesters to that year\n' +
                    '4. Use "Set as Active" to make it the current period',
                    'Setup Required'
                );
                resetDependentFields(['yearSection', 'subjectCode', 'classType', 'room']);
            }
        })
        .catch(error => {
            console.error('Error loading active period:', error);
            showModal('Failed to load active period. Please check console for details.', 'Error');
            resetDependentFields(['yearSection', 'subjectCode', 'classType', 'room']);
        });
}

function loadYearSections() {
    if (!currentProgramId || !currentAcademicYear || !currentSemester) {
        console.warn('Missing required parameters:', {
            program: currentProgramId,
            year: currentAcademicYear,
            semester: currentSemester
        });
        return;
    }
    
    console.log(`Loading sections for: ${currentProgramId}, ${currentAcademicYear}, ${currentSemester}`);
    
    yearSectionSelect.innerHTML = '<option value="" disabled selected>Loading...</option>';
    yearSectionSelect.disabled = true;
    
    fetch(`/api/get_year_sections?program_id=${currentProgramId}&academic_year=${encodeURIComponent(currentAcademicYear)}&semester=${encodeURIComponent(currentSemester)}`)
        .then(response => response.json())
        .then(data => {
            console.log('Year sections response:', data);
            
            if (data.success) {
                yearSectionsCache = data.sections;
                
                yearSectionSelect.innerHTML = '<option value="" disabled selected>-- Choose Year & Section --</option>';
                
                if (data.sections.length === 0) {
                    yearSectionSelect.innerHTML += '<option value="" disabled>No sections found for this semester</option>';
                    showModal(
                        `No sections found for ${currentAcademicYear} - ${currentSemester}.\n\n` +
                        'Please add sections in the Programs page first.',
                        'No Sections'
                    );
                } else {
                    data.sections.forEach(section => {
                        const option = document.createElement('option');
                        option.value = section.section_id;
                        option.dataset.sectionId = section.section_id;
                        option.textContent = `${section.year_level}${getOrdinalSuffix(section.year_level)} Year - Section ${section.section_name}`;
                        yearSectionSelect.appendChild(option);
                    });
                    yearSectionSelect.disabled = false;
                }
            } else {
                showModal('Failed to load year sections: ' + data.message, 'Error');
                yearSectionSelect.innerHTML = '<option value="" disabled selected>Error loading sections</option>';
            }
        })
        .catch(error => {
            console.error('Error loading year sections:', error);
            showModal('Failed to load year sections: ' + error.message, 'Error');
            yearSectionSelect.innerHTML = '<option value="" disabled selected>Error loading sections</option>';
        });
}

    function resetDependentFields(fields) {
        const fieldMap = {
            'yearSection': yearSectionSelect,
            'subjectCode': subjectCodeSelect,
            'classType': classTypeSelect,
            'room': roomSelect
        };
        
        fields.forEach(field => {
            const element = fieldMap[field];
            if (element) {
                element.innerHTML = `<option value="" disabled selected>-- ${field === 'room' ? 'Select Class Type First' : 'Select Option'} --</option>`;
                element.disabled = true;
            }
        });
        
        updateAddScheduleButton();
    }

    // Add this after loading subjects
function loadSubjects() {
    if (!currentSectionId) return;
    
    subjectCodeSelect.innerHTML = '<option value="" disabled selected>Loading...</option>';
    subjectCodeSelect.disabled = true;
    
    fetch(`/api/get_subjects?section_id=${currentSectionId}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                subjectsCache[currentSectionId] = data.subjects;
                
                subjectCodeSelect.innerHTML = '<option value="" disabled selected>-- Select Subject Code --</option>';
                data.subjects.forEach(subject => {
                    const option = document.createElement('option');
                    option.value = subject.subject_id;
                    option.dataset.subjectId = subject.subject_id;
                    option.dataset.classType = subject.class_type;
                    option.dataset.subjectCode = subject.subject_code;
                    option.dataset.subjectName = subject.subject_name;
                    option.dataset.units = subject.units; // Store units
                    option.textContent = `${subject.subject_code} - ${subject.subject_name} (${subject.units} units)`;
                    subjectCodeSelect.appendChild(option);
                });
                
                subjectCodeSelect.disabled = false;
            } else {
                showModal('Failed to load subjects: ' + data.message, 'Error');
            }
        })
        .catch(error => {
            console.error('Error loading subjects:', error);
            showModal('Failed to load subjects', 'Error');
        });
}

// Update start time change handler to auto-calculate end time
startTimeSelect.addEventListener('change', function() {
    autoCalculateEndTime();
    validateTimeInputs();
});

function autoCalculateEndTime() {
    const startTime = startTimeSelect.value;
    const subjectOption = subjectCodeSelect.options[subjectCodeSelect.selectedIndex];
    
    if (!startTime || !subjectOption || !subjectOption.dataset.units) {
        return;
    }
    
    const units = parseInt(subjectOption.dataset.units);
    const startMinutes = timeToMinutes(startTime);
    const endMinutes = startMinutes + (units * 60); // units = hours
    
    // Convert back to 12-hour format
    const endTime = minutesToTime(endMinutes);
    
    // Find and select the matching end time option
    const endTimeOptions = Array.from(endTimeSelect.options);
    const matchingOption = endTimeOptions.find(opt => opt.value === endTime);
    
    if (matchingOption) {
        endTimeSelect.value = endTime;
        endTimeSelect.classList.add('auto-populated');
        
        // Show info message
        const infoDiv = document.createElement('div');
        infoDiv.className = 'auto-calc-info';
        infoDiv.innerHTML = `<i class="fas fa-info-circle"></i> End time auto-calculated based on ${units} unit${units > 1 ? 's' : ''} (${units} hour${units > 1 ? 's' : ''})`;
        infoDiv.style.cssText = 'color: #17a2b8; font-size: 0.85rem; margin-top: 5px;';
        
        // Remove previous info if exists
        const existingInfo = endTimeSelect.parentElement.querySelector('.auto-calc-info');
        if (existingInfo) {
            existingInfo.remove();
        }
        
        endTimeSelect.parentElement.appendChild(infoDiv);
        
        // Remove info after 3 seconds
        setTimeout(() => {
            if (infoDiv.parentElement) {
                infoDiv.remove();
            }
        }, 3000);
    } else {
        showModal(`Cannot find matching end time. Class would end at ${endTime}. Please adjust start time or add this time slot.`, 'Time Not Available');
    }
    
    updateAddScheduleButton();
}

function minutesToTime(totalMinutes) {
    // Handle overflow past midnight
    totalMinutes = totalMinutes % (24 * 60);
    
    let hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;
    const period = hours >= 12 ? 'PM' : 'AM';
    
    // Convert to 12-hour format
    if (hours === 0) {
        hours = 12;
    } else if (hours > 12) {
        hours -= 12;
    }
    
    return `${hours}:${minutes.toString().padStart(2, '0')} ${period}`;
}

// Update the subject code change handler to trigger end time calculation
subjectCodeSelect.addEventListener('change', function() {
    const selectedOption = this.options[this.selectedIndex];
    const subjectClassType = selectedOption.dataset.classType;
    const units = selectedOption.dataset.units;
    
    // Show units info
    const unitsInfo = document.createElement('div');
    unitsInfo.className = 'units-info';
    unitsInfo.innerHTML = `<i class="fas fa-clock"></i> This subject is ${units} unit${units > 1 ? 's' : ''} (${units} hour${units > 1 ? 's' : ''} class duration)`;
    unitsInfo.style.cssText = 'color: #28a745; font-size: 0.85rem; margin-top: 5px; font-weight: 500;';
    
    // Remove previous info
    const existingInfo = this.parentElement.querySelector('.units-info');
    if (existingInfo) {
        existingInfo.remove();
    }
    
    this.parentElement.appendChild(unitsInfo);
    
    // Populate class type based on subject
    classTypeSelect.innerHTML = '<option value="" disabled selected>-- Select Class Type --</option>';
    
    if (subjectClassType === 'both') {
        classTypeSelect.innerHTML += '<option value="lecture">Lecture</option>';
        classTypeSelect.innerHTML += '<option value="laboratory">Laboratory</option>';
    } else {
        classTypeSelect.innerHTML += `<option value="${subjectClassType}">${subjectClassType.charAt(0).toUpperCase() + subjectClassType.slice(1)}</option>`;
    }
    
    classTypeSelect.disabled = false;
    
    // If start time is already selected, recalculate end time
    if (startTimeSelect.value) {
        autoCalculateEndTime();
    }
    
    resetDependentFields(['room']);
});

    function populateRooms(classType) {
        roomSelect.innerHTML = '<option value="" disabled selected>-- Select Room --</option>';
        
        if (!classType || !ROOM_MAPPING[classType]) {
            roomSelect.disabled = true;
            return;
        }
        
        const availableRooms = ROOM_MAPPING[classType];
        roomSelect.disabled = false;
        
        availableRooms.forEach(room => {
            const option = document.createElement('option');
            option.value = room;
            option.textContent = room;
            roomSelect.appendChild(option);
        });
    }

    function validateTimeInputs() {
    if (!startTimeSelect.value || !endTimeSelect.value) return true;
    
    const startMins = timeToMinutes(startTimeSelect.value);
    const endMins = timeToMinutes(endTimeSelect.value);
    const subjectOption = subjectCodeSelect.options[subjectCodeSelect.selectedIndex];
    
    startTimeSelect.classList.remove('time-conflict');
    endTimeSelect.classList.remove('time-conflict');
    
    if (startMins >= endMins) {
        startTimeSelect.classList.add('time-conflict');
        endTimeSelect.classList.add('time-conflict');
        document.getElementById('warningTitle').textContent = 'Invalid Time';
        document.getElementById('scheduleErrorMessage').textContent = "Start time must be before end time.";
        document.getElementById('scheduleWarningModal').style.display = 'flex';
        return false;
    }
    
    const actualDuration = (endMins - startMins) / 60;
    
    // Check if duration matches units
    if (subjectOption && subjectOption.dataset.units) {
        const expectedDuration = parseInt(subjectOption.dataset.units);
        
        if (Math.abs(actualDuration - expectedDuration) > 0.1) { // Allow small rounding differences
            const userConfirm = confirm(
                `Note: This subject is ${expectedDuration} unit${expectedDuration > 1 ? 's' : ''} (${expectedDuration} hour${expectedDuration > 1 ? 's' : ''}), ` +
                `but your selected duration is ${actualDuration.toFixed(1)} hour${actualDuration !== 1 ? 's' : ''}.\n\n` +
                `Do you want to continue with this duration?`
            );
            
            if (!userConfirm) {
                return false;
            }
        }
    }
    
    // Standard duration check (1-3 hours)
    if (actualDuration < 1 || actualDuration > 3) {
        startTimeSelect.classList.add('time-conflict');
        endTimeSelect.classList.add('time-conflict');
        document.getElementById('warningTitle').textContent = 'Duration Error';
        document.getElementById('scheduleErrorMessage').textContent = `Class duration must be between 1 to 3 hours. Current: ${actualDuration.toFixed(1)} hours.`;
        document.getElementById('scheduleWarningModal').style.display = 'flex';
        return false;
    }
    
    return true;
}

// Allow manual end time adjustment but keep validation
endTimeSelect.addEventListener('change', function() {
    this.classList.remove('auto-populated');
    
    // Remove auto-calc info if user manually changes
    const infoDiv = this.parentElement.querySelector('.auto-calc-info');
    if (infoDiv) {
        infoDiv.remove();
    }
    
    validateTimeInputs();
    updateAddScheduleButton();
});

    function timeToMinutes(timeStr) {
        if (!timeStr) return 0;
        const [time, period] = timeStr.split(' ');
        const [hours, minutes] = time.split(':').map(Number);
        let totalMinutes = (hours % 12) * 60 + minutes;
        if (period === 'PM') totalMinutes += 12 * 60;
        return totalMinutes;
    }

    function convertTo24Hour(time12h) {
        const [time, period] = time12h.split(' ');
        let [hours, minutes] = time.split(':');
        hours = parseInt(hours);
        
        if (period === 'PM' && hours !== 12) {
            hours += 12;
        } else if (period === 'AM' && hours === 12) {
            hours = 0;
        }
        
        return `${hours.toString().padStart(2, '0')}:${minutes}:00`;
    }

    function isFormComplete() {
        return programSelect.value && yearSectionSelect.value && subjectCodeSelect.value && 
               classTypeSelect.value && scheduleDaySelect.value && startTimeSelect.value && 
               endTimeSelect.value && roomSelect.value;
    }

    function updateAddScheduleButton() {
        addScheduleBtn.disabled = !isFormComplete();
    }

    function getOrdinalSuffix(num) {
        const j = num % 10;
        const k = num % 100;
        if (j == 1 && k != 11) return "st";
        if (j == 2 && k != 12) return "nd";
        if (j == 3 && k != 13) return "rd";
        return "th";
    }

    // Add schedule to pending
    addScheduleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        
        if (!validateTimeInputs()) return;
        
        const subjectOption = subjectCodeSelect.options[subjectCodeSelect.selectedIndex];
        const subjectId = subjectOption.value;
        const subjectCode = subjectOption.dataset.subjectCode;
        const subjectName = subjectOption.dataset.subjectName;
        
        const newSchedule = {
            subject_id: parseInt(subjectId),
            section_id: parseInt(currentSectionId),
            subject_code: subjectCode,
            subject_name: subjectName,
            class_type: classTypeSelect.value,
            day_of_week: scheduleDaySelect.value,
            start_time: convertTo24Hour(startTimeSelect.value),
            end_time: convertTo24Hour(endTimeSelect.value),
            room: roomSelect.value,
            start_time_display: startTimeSelect.value,
            end_time_display: endTimeSelect.value,
            id: Date.now()
        };
        
        // Check for duplicates
        if (pendingSchedules.some(s => 
            s.subject_id === newSchedule.subject_id &&
            s.day_of_week === newSchedule.day_of_week &&
            s.start_time === newSchedule.start_time &&
            s.room === newSchedule.room
        )) {
            showModal("This schedule already exists in pending list.", "Duplicate");
            return;
        }
        
        // Check room availability
        checkRoomAvailability(newSchedule);
    });

    function checkRoomAvailability(schedule) {
        fetch('/api/check_room_availability', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                room: schedule.room,
                day_of_week: schedule.day_of_week,
                start_time: schedule.start_time,
                end_time: schedule.end_time
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                if (!data.available && data.conflicts.length > 0) {
                    const conflict = data.conflicts[0];
                    const confirmAdd = confirm(
                        `Room ${schedule.room} is already booked on ${schedule.day_of_week} ` +
                        `at ${conflict.start_time} - ${conflict.end_time} for ` +
                        `${conflict.subject_code} (Year ${conflict.year_level}-${conflict.section_name}).\n\n` +
                        `Do you still want to add this schedule?`
                    );
                    
                    if (!confirmAdd) return;
                }
                
                // Add to pending
                pendingSchedules.push(schedule);
                updatePendingDisplay();
                showModal(`Added ${schedule.class_type} session for ${schedule.subject_name} to pending list.`, "Schedule Added");
            } else {
                showModal('Failed to check room availability', 'Error');
            }
        })
        .catch(error => {
            console.error('Error checking room availability:', error);
            showModal('Failed to check room availability', 'Error');
        });
    }

    function updatePendingDisplay() {
        pendingList.innerHTML = '';
        pendingCount.textContent = pendingSchedules.length;
        totalPendingCount.textContent = pendingSchedules.length;
        
        if (pendingSchedules.length > 0) {
            pendingSchedulesDiv.style.display = 'block';
            clearPendingBtn.style.display = 'inline-flex';
            saveAllBtn.disabled = false;
            
            pendingSchedules.forEach(schedule => {
                const li = document.createElement('li');
                li.className = 'pending-item';
                li.innerHTML = `
                    <div class="schedule-info">
                        <strong>${schedule.subject_name}</strong> - ${schedule.class_type}<br>
                        <small>${schedule.day_of_week}, ${schedule.start_time_display} - ${schedule.end_time_display} (${schedule.room})</small>
                    </div>
                    <button class="delete-pending" onclick="removePending(${schedule.id})" title="Remove">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                pendingList.appendChild(li);
            });
        } else {
            pendingSchedulesDiv.style.display = 'none';
            clearPendingBtn.style.display = 'none';
            saveAllBtn.disabled = true;
        }
    }

    window.removePending = function(id) {
        const index = pendingSchedules.findIndex(s => s.id === id);
        if (index > -1) {
            pendingSchedules.splice(index, 1);
            updatePendingDisplay();
        }
    }

    // Save all pending schedules
    saveAllBtn.addEventListener('click', function(e) {
        e.preventDefault();
        
        if (pendingSchedules.length === 0) {
            showModal("No pending schedules to save.", "No Schedules");
            return;
        }
        
        const schedulesToSave = pendingSchedules.map(s => ({
            subject_id: s.subject_id,
            section_id: s.section_id,
            class_type: s.class_type,
            day_of_week: s.day_of_week,
            start_time: s.start_time,
            end_time: s.end_time,
            room: s.room
        }));
        
        fetch('/api/bulk_add_schedules', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ schedules: schedulesToSave })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showModal(data.message, 'Success');
                pendingSchedules = [];
                updatePendingDisplay();
                form.reset();
                resetDependentFields(['yearSection', 'subjectCode', 'classType', 'room']);
                loadAllSchedules();
            } else {
                showModal(data.message, 'Error');
            }
        })
        .catch(error => {
            console.error('Error saving schedules:', error);
            showModal('Failed to save schedules', 'Error');
        });
    });

    // Clear pending schedules
    clearPendingBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (confirm('Clear all pending schedules?')) {
            pendingSchedules = [];
            updatePendingDisplay();
        }
    });

    // Reset form
    resetBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (confirm('Reset form and clear pending schedules?')) {
            form.reset();
            pendingSchedules = [];
            updatePendingDisplay();
            resetDependentFields(['yearSection', 'subjectCode', 'classType', 'room']);
        }
    });

    // Load all schedules
    function loadAllSchedules() {
        fetch('/api/get_schedules')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    allSchedules = data.schedules;
                    renderScheduleTable();
                }
            })
            .catch(error => console.error('Error loading schedules:', error));
    }

    function renderScheduleTable() {
        tableBody.innerHTML = '';
        
        // Group schedules by subject and section
        const grouped = {};
        
        allSchedules.forEach(schedule => {
            const key = `${schedule.subject_code}-${schedule.section_id}`;
            if (!grouped[key]) {
                grouped[key] = {
                    subject_code: schedule.subject_code,
                    subject_name: schedule.subject_name,
                    year_level: schedule.year_level,
                    section_name: schedule.section_name,
                    program_name: schedule.program_name,
                    schedules: []
                };
            }
            grouped[key].schedules.push(schedule);
        });
        
        Object.values(grouped).forEach(group => {
            const row = document.createElement('tr');
            
            // Get unique class types and rooms
            const classTypes = [...new Set(group.schedules.map(s => s.class_type))];
            const rooms = [...new Set(group.schedules.map(s => s.room))];
            
            // Build schedule display
            let scheduleDisplay = '';
            group.schedules.forEach(s => {
                scheduleDisplay += `
                    <div class="schedule-item ${s.class_type}">
                        <span class="schedule-type ${s.class_type}">${s.class_type}</span>
                        ${s.day_of_week} ${formatTime(s.start_time)} - ${formatTime(s.end_time)} (${s.room})
                    </div>
                `;
            });
            
            row.innerHTML = `
                <td>${group.year_level}${getOrdinalSuffix(group.year_level)} Year - ${group.section_name}</td>
                <td>${group.subject_code}</td>
                <td>${group.subject_name}</td>
                <td>${classTypes.map(ct => `<span class="schedule-type ${ct}">${ct}</span>`).join(', ')}</td>
                <td class="merged-content">${scheduleDisplay}</td>
                <td>${rooms.join(', ')}</td>
                <td class="action-btns">
                    <button class="action-btns delete" onclick="deleteScheduleGroup('${group.subject_code}', ${group.schedules[0].section_id})" title="Delete">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            `;
            
            tableBody.appendChild(row);
        });
    }

    function formatTime(time24) {
        const [hours, minutes] = time24.split(':');
        const hour = parseInt(hours);
        const period = hour >= 12 ? 'PM' : 'AM';
        const displayHour = hour === 0 ? 12 : (hour > 12 ? hour - 12 : hour);
        return `${displayHour}:${minutes} ${period}`;
    }

    window.deleteScheduleGroup = function(subjectCode, sectionId) {
        if (!confirm(`Delete all schedules for ${subjectCode}?`)) return;
        
        const scheduleIds = allSchedules
            .filter(s => s.subject_code === subjectCode && s.section_id === sectionId)
            .map(s => s.schedule_id);
        
        Promise.all(scheduleIds.map(id => 
            fetch('/api/delete_schedule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ schedule_id: id })
            })
        ))
        .then(() => {
            showModal('Schedules deleted successfully', 'Success');
            loadAllSchedules();
        })
        .catch(error => {
            console.error('Error deleting schedules:', error);
            showModal('Failed to delete schedules', 'Error');
        });
    }

    // Close modals with Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (modalOverlay.style.display === 'flex') {
                modalOverlay.style.display = 'none';
            }
            const warningModal = document.getElementById('scheduleWarningModal');
            if (warningModal && warningModal.style.display === 'flex') {
                closeWarningModal();
            }
        }
    });
</script>
