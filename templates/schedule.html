<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedules</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='schedule.css') }}">
    <style>
        .phase {
            display: none;
        }
        .phase.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header">
            <h2><i class="fas fa-calendar-alt"></i> Faculty Member Schedules</h2>
        </div>

        <div class="phase active" id="phase1">
            <div class="schedule-table">
                <div class="phase-header">
                    <h3>Unassigned Faculty Members Overview</h3>
                    <button class="add-schedule-btn" onclick="showPhase2()">
                        <i class="fas fa-plus"></i> Add Schedule
                    </button>
                </div>
                <table id="unassignedTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="schedule-table">
                <h3>Current Schedule List</h3>
                <table id="scheduleTable">
                    <thead>
                        <tr>
                            <th>Faculty Member</th>
                            <th>Subject</th>
                            <th>Meetings</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="phase" id="phase2">
            <div class="phase-header">
                <button class="back-button" onclick="showPhase1()">
                    <i class="fas fa-arrow-left"></i> Back to Overview
                </button>
            </div>
            
            <div class="schedule-form">
                <h3>Add Schedule</h3>
                <form id="scheduleForm" onsubmit="return false;">
                    <div class="course-selection">
                        <div>
                            <label for="course">Course</label>
                            <select id="course" onchange="loadSections()">
                                <option value="" disabled selected>Select Course</option>
                                <option value="CS">BS Computer Science</option>
                                <option value="IT">BS Information Technology</option>
                            </select>
                        </div>
                        <div>
                            <label for="yearLevel">Year Level</label>
                            <select id="yearLevel" onchange="loadSections()">
                                <option value="" disabled selected>Select Year</option>
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4">4th Year</option>
                            </select>
                        </div>
                        <div>
                            <label for="section">Section</label>
                            <select id="section" onchange="loadClassSchedule()" disabled>
                                <option value="" disabled selected>Select Section</option>
                            </select>
                        </div>
                        <div>
                            <label for="facultyMember">Faculty Member</label>
                            <select id="facultyMember" onchange="checkConflicts()">
                                <option value="" disabled selected>Select Faculty Member</option>
                                <option value="1">Guilmar Quimba</option>
                                <option value="2">Jane Smith</option>
                                <option value="3">John Doe</option>
                                <option value="4">Emily Davis</option>
                            </select>
                        </div>
                    </div>

                    <div id="classSchedule" class="schedule-calendar" style="display: none;">
                        <div class="calendar-header">Class Schedule</div>
                        <div class="day-header">Time</div>
                        <div class="day-header">Monday</div>
                        <div class="day-header">Tuesday</div>
                        <div class="day-header">Wednesday</div>
                        <div class="day-header">Thursday</div>
                        <div class="day-header">Friday</div>
                        <div class="day-header">Saturday</div>
                    </div>

                    <div class="save-schedule-container">
                        <button type="button" id="saveScheduleBtn" class="save-schedule-btn" disabled onclick="saveSchedule()">
                            <i class="fas fa-save"></i> Save Schedule
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Warning</h3>
            <p id="modalMessage"></p>
            <button id="closeModal">Close</button>
        </div>
    </div>

    <div class="schedule-overview-modal" id="scheduleOverviewModal">
        <div class="schedule-overview-content">
            <div class="schedule-overview-header">
                <h3>Faculty Member Schedule Overview</h3>
                <button class="schedule-overview-close" id="closeOverviewModal">&times;</button>
            </div>
            <div id="overviewContent"></div>
        </div>
    </div>

    <script>
console.log('Starting sidebar fetch...');

// Global state
let allFaculty = [];
let selectedScheduleIds = new Set();
let currentFacultyId = null;
let currentSectionId = null;

// Define global functions
function showPhase1() {
    console.log('showPhase1 called');
    const phase1 = document.getElementById('phase1');
    const phase2 = document.getElementById('phase2');
    if (!phase1 || !phase2) {
        console.error('Phase elements not found');
        return;
    }
    phase2.classList.remove('active');
    phase1.classList.add('active');
    
    // Refresh data when returning to phase 1
    loadUnassignedFaculty();
    loadFacultyWithSchedules();
}
window.showPhase1 = showPhase1;

function showPhase2() {
    console.log('showPhase2 called');
    const phase1 = document.getElementById('phase1');
    const phase2 = document.getElementById('phase2');
    if (!phase1 || !phase2) {
        console.error('Phase elements not found');
        return;
    }
    phase1.classList.remove('active');
    phase2.classList.add('active');
    
    const form = document.getElementById('scheduleForm');
    if (form) form.reset();
    
    const classSchedule = document.getElementById('classSchedule');
    if (classSchedule) classSchedule.style.display = 'none';
    
    selectedScheduleIds.clear();
    currentSectionId = null;
    
    // Load all faculty for dropdown
    loadAllFaculty();
}
window.showPhase2 = showPhase2;

// Load sidebar with error handling
fetch('/sidebar')
    .then(response => {
        console.log('Fetch response status:', response.status);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.text();
    })
    .then(html => {
        console.log('Sidebar HTML received');
        document.getElementById('sidebar-container').innerHTML = html;
        
        // Initialize dropdown functionality
        document.querySelectorAll(".dropdown-btn").forEach(btn => {
            btn.addEventListener("click", function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                document.querySelectorAll('.dropdown-content').forEach(content => {
                    if (content !== this.nextElementSibling) {
                        content.style.display = 'none';
                    }
                });

                const content = this.nextElementSibling;
                if (content) {
                    content.style.display = content.style.display === 'block' ? 'none' : 'block';
                }
            });
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown')) {
                document.querySelectorAll('.dropdown-content').forEach(content => {
                    content.style.display = 'none';
                });
            }
        });

        const currentPath = window.location.pathname;
        document.querySelectorAll('.nav-items a').forEach(link => {
            const linkPath = link.getAttribute('href');
            if (currentPath.includes(linkPath) && linkPath !== '#') {
                link.classList.add('active');
                const dropdown = link.closest('.dropdown-content');
                if (dropdown) {
                    dropdown.style.display = 'block';
                }
            }
        });
    })
    .catch(error => {
        console.error('Sidebar fetch failed:', error);
        document.getElementById('sidebar-container').innerHTML = `
            <div style="color: red; padding: 20px;">
                <h3>Sidebar Error</h3>
                <p>Failed to load sidebar: ${error.message}</p>
            </div>
        `;
    })
    .finally(() => {
        initializeScheduleApp();
    });

// API Functions
async function loadUnassignedFaculty() {
    try {
        const response = await fetch('/api/get_unassigned_faculty');
        const data = await response.json();
        
        if (data.success) {
            const tbody = document.querySelector('#unassignedTable tbody');
            tbody.innerHTML = '';
            
            data.faculty.forEach(faculty => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${faculty.full_name}</td>
                    <td>${faculty.department || 'N/A'}</td>
                    <td>
                        <button class="add-schedule-btn" onclick="assignFaculty(${faculty.faculty_id})">
                            <i class="fas fa-plus"></i> Assign
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    } catch (error) {
        console.error('Error loading unassigned faculty:', error);
        showModal('Failed to load unassigned faculty');
    }
}

async function loadFacultyWithSchedules() {
    try {
        const response = await fetch('/api/get_faculty_with_schedules');
        const data = await response.json();
        
        if (data.success) {
            const tbody = document.querySelector('#scheduleTable tbody');
            tbody.innerHTML = '';
            
            data.faculty.forEach(faculty => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${faculty.full_name}</td>
                    <td>${faculty.subject_count}</td>
                    <td>${faculty.meeting_count}</td>
                    <td class="action-btns">
                        <button class="btn-view-schedule" title="View Schedule" onclick="viewFacultySchedule(${faculty.faculty_id}, '${faculty.full_name}')">
                            <i class="fas fa-calendar-alt"></i>
                        </button>
                        <button class="delete" title="Unassign All" onclick="unassignAllSchedules(${faculty.faculty_id})">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    } catch (error) {
        console.error('Error loading faculty with schedules:', error);
        showModal('Failed to load faculty schedules');
    }
}

async function loadAllFaculty() {
    try {
        const response = await fetch('/api/get_all_faculty');
        const data = await response.json();
        
        if (data.success) {
            allFaculty = data.faculty;
            const select = document.getElementById('facultyMember');
            select.innerHTML = '<option value="" disabled selected>Select Faculty Member</option>';
            
            data.faculty.forEach(faculty => {
                const option = document.createElement('option');
                option.value = faculty.faculty_id;
                option.textContent = faculty.full_name;
                select.appendChild(option);
            });
        }
    } catch (error) {
        console.error('Error loading all faculty:', error);
        showModal('Failed to load faculty list');
    }
}

async function loadSections() {
    const course = document.getElementById('course').value;
    const yearLevel = document.getElementById('yearLevel').value;
    const sectionSelect = document.getElementById('section');
    
    if (!course || !yearLevel) {
        sectionSelect.disabled = true;
        sectionSelect.innerHTML = '<option value="" disabled selected>Select Section</option>';
        return;
    }
    
    try {
        // Fetch sections based on course and year level
        const response = await fetch(`/api/get_sections?program_id=${course}&year_level=${yearLevel}`);
        const data = await response.json();
        
        if (data.success && data.sections.length > 0) {
            sectionSelect.disabled = false;
            sectionSelect.innerHTML = '<option value="" disabled selected>Select Section</option>';
            
            data.sections.forEach(section => {
                const option = document.createElement('option');
                option.value = section.section_id;
                option.textContent = section.section_name;
                sectionSelect.appendChild(option);
            });
        } else {
            sectionSelect.disabled = true;
            sectionSelect.innerHTML = '<option value="" disabled selected>No sections available</option>';
        }
    } catch (error) {
        console.error('Error loading sections:', error);
        showModal('Failed to load sections');
    }
}
window.loadSections = loadSections;

async function loadClassSchedule() {
    const sectionId = document.getElementById('section').value;
    const calendar = document.getElementById('classSchedule');
    
    if (!sectionId || !calendar) {
        if (calendar) calendar.style.display = 'none';
        return;
    }
    
    currentSectionId = sectionId;
    selectedScheduleIds.clear();
    
    try {
        const response = await fetch(`/api/get_class_schedules_for_section?section_id=${sectionId}`);
        const data = await response.json();
        
        if (data.success) {
            renderScheduleGrid(data.schedules);
            updateSaveButton();
        }
    } catch (error) {
        console.error('Error loading class schedule:', error);
        showModal('Failed to load class schedule');
    }
}
window.loadClassSchedule = loadClassSchedule;

function renderScheduleGrid(schedules) {
    const calendar = document.getElementById('classSchedule');
    calendar.style.display = 'grid';
    
    // Clear existing cells
    const cells = calendar.querySelectorAll('.time-cell, .schedule-cell');
    cells.forEach(cell => cell.remove());
    
    // Get unique time slots from schedules
    const timeSlots = new Set();
    schedules.forEach(s => {
        timeSlots.add(`${s.start_time.substring(0, 5)} - ${s.end_time.substring(0, 5)}`);
    });
    
    const sortedTimeSlots = Array.from(timeSlots).sort();
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    
    sortedTimeSlots.forEach(time => {
        const timeCell = document.createElement('div');
        timeCell.className = 'time-cell';
        timeCell.textContent = time;
        calendar.appendChild(timeCell);
        
        days.forEach(day => {
            const [startTime, endTime] = time.split(' - ');
            const schedule = schedules.find(s =>
                s.day_of_week === day &&
                s.start_time.substring(0, 5) === startTime &&
                s.end_time.substring(0, 5) === endTime
            );
            
            const scheduleCell = document.createElement('div');
            scheduleCell.className = 'schedule-cell';
            
            if (schedule) {
                scheduleCell.dataset.scheduleId = schedule.schedule_id;
                
                if (schedule.is_assigned) {
                    scheduleCell.className = 'schedule-cell occupied';
                    scheduleCell.innerHTML = `
                        <div class="subject-info">
                            <div class="subject-code">${schedule.subject_code} - ${schedule.subject_name}</div>
                            <div class="subject-room">${schedule.class_type || 'Lecture'} | Room: ${schedule.room || 'TBA'}</div>
                            <div class="faculty-member-name">${schedule.faculty_name}</div>
                        </div>
                    `;
                } else {
                    scheduleCell.innerHTML = `
                        <div class="subject-info">
                            <div class="subject-code">${schedule.subject_code} - ${schedule.subject_name}</div>
                            <div style="font-weight:lighter; font-size:0.7rem;" class="subject-room">${schedule.class_type || 'Lecture'} | Click to assign</div>
                        </div>
                    `;
                    
                    scheduleCell.addEventListener('click', () => {
                        if (!scheduleCell.classList.contains('occupied')) {
                            scheduleCell.classList.toggle('selected');
                            
                            if (scheduleCell.classList.contains('selected')) {
                                selectedScheduleIds.add(schedule.schedule_id);
                            } else {
                                selectedScheduleIds.delete(schedule.schedule_id);
                            }
                            
                            updateSaveButton();
                        }
                    });
                }
            } else {
                scheduleCell.innerHTML = '<div class="subject-info"><div style="color:#ccc;">No class</div></div>';
            }
            
            calendar.appendChild(scheduleCell);
        });
    });
}

async function saveSchedule() {
    const facultyId = document.getElementById('facultyMember').value;
    
    if (!facultyId) {
        showModal('Please select a faculty member');
        return;
    }
    
    if (selectedScheduleIds.size === 0) {
        showModal('Please select at least one schedule slot');
        return;
    }
    
    try {
        const response = await fetch('/api/assign_faculty_to_schedule', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                faculty_id: facultyId,
                schedule_ids: Array.from(selectedScheduleIds)
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            showModal(`Successfully assigned ${data.assigned_count} schedule(s)!`);
            selectedScheduleIds.clear();
            
            // Reload the schedule to show updated assignments
            await loadClassSchedule();
            
            // Go back to phase 1 after short delay
            setTimeout(() => {
                showPhase1();
            }, 1500);
        } else {
            showModal(data.message || 'Failed to assign schedules');
        }
    } catch (error) {
        console.error('Error saving schedule:', error);
        showModal('Failed to save schedule');
    }
}
window.saveSchedule = saveSchedule;

async function viewFacultySchedule(facultyId, facultyName) {
    try {
        const response = await fetch(`/api/get_faculty_schedule?faculty_id=${facultyId}`);
        const data = await response.json();
        
        if (data.success) {
            displayFacultyScheduleModal(facultyName, data.subjects);
        }
    } catch (error) {
        console.error('Error viewing faculty schedule:', error);
        showModal('Failed to load faculty schedule');
    }
}
window.viewFacultySchedule = viewFacultySchedule;

function displayFacultyScheduleModal(facultyName, subjects) {
    const modal = document.getElementById('scheduleOverviewModal');
    const content = document.getElementById('overviewContent');
    
    content.innerHTML = `<h4>${facultyName}</h4>`;
    
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const calendar = document.createElement('div');
    calendar.className = 'weekly-calendar';
    
    days.forEach(day => {
        const dayCol = document.createElement('div');
        dayCol.className = 'day-column';
        
        const dayHeader = document.createElement('div');
        dayHeader.className = 'day-header';
        dayHeader.textContent = day;
        dayCol.appendChild(dayHeader);
        
        subjects.forEach(subject => {
            const dayMeetings = subject.meetings.filter(m => m.day === day);
            dayMeetings.forEach(meeting => {
                const scheduleItem = document.createElement('div');
                scheduleItem.className = 'schedule-item';
                scheduleItem.innerHTML = `
                    <strong>${subject.subject_code} - ${subject.subject_name}</strong><br>
                    ${subject.program} ${subject.year_level}-${subject.section}<br>
                    ${meeting.start_time} - ${meeting.end_time}<br>
                    Room: ${meeting.room || 'TBA'}
                `;
                dayCol.appendChild(scheduleItem);
            });
        });
        
        calendar.appendChild(dayCol);
    });
    
    content.appendChild(calendar);
    modal.style.display = 'block';
}

async function unassignAllSchedules(facultyId) {
    if (!confirm('Are you sure you want to unassign all schedules for this faculty member?')) {
        return;
    }
    
    try {
        const response = await fetch('/api/unassign_faculty_from_schedule', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                faculty_id: facultyId
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            showModal(`Unassigned ${data.affected_rows} schedule(s)`);
            loadUnassignedFaculty();
            loadFacultyWithSchedules();
        } else {
            showModal(data.message || 'Failed to unassign schedules');
        }
    } catch (error) {
        console.error('Error unassigning schedules:', error);
        showModal('Failed to unassign schedules');
    }
}
window.unassignAllSchedules = unassignAllSchedules;

function assignFaculty(facultyId) {
    showPhase2();
    setTimeout(() => {
        const facultySelect = document.getElementById('facultyMember');
        if (facultySelect) {
            facultySelect.value = facultyId;
            currentFacultyId = facultyId;
        }
    }, 100);
}
window.assignFaculty = assignFaculty;

function updateSaveButton() {
    const saveBtn = document.getElementById('saveScheduleBtn');
    if (saveBtn) {
        saveBtn.disabled = selectedScheduleIds.size === 0;
    }
}

function showModal(message) {
    const modalOverlay = document.getElementById('modalOverlay');
    const modalMessage = document.getElementById('modalMessage');
    
    if (modalMessage && modalOverlay) {
        modalMessage.textContent = message;
        modalOverlay.style.display = 'flex';
    }
}
window.showModal = showModal;

// Initialize schedule functionality
function initializeScheduleApp() {
    console.log('initializeScheduleApp called');
    
    // Modal functionality
    const closeModal = document.getElementById('closeModal');
    const modalOverlay = document.getElementById('modalOverlay');
    
    if (closeModal) {
        closeModal.addEventListener('click', () => {
            if (modalOverlay) modalOverlay.style.display = 'none';
        });
    }
    
    // Schedule overview modal
    const closeOverviewModal = document.getElementById('closeOverviewModal');
    const scheduleOverviewModal = document.getElementById('scheduleOverviewModal');
    
    if (closeOverviewModal) {
        closeOverviewModal.addEventListener('click', () => {
            if (scheduleOverviewModal) scheduleOverviewModal.style.display = 'none';
        });
    }
    
    // Load initial data
    loadUnassignedFaculty();
    loadFacultyWithSchedules();
}
    </script>
</body>
</html>
