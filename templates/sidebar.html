<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/sidebar.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='sidebar.css') }}">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <h1>Admin Side</h1>
        </div>
        <div class="user-info">
            <div class="avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="name">Unknown User</div>
            <div class="role">Admin</div>
        </div>
        <ul class="nav-items">
            <li class="timer-item">
                <a href="../templates/timer.html"><i class="fas fa-stopwatch"></i> <span>Go to Timer</span></a>
            </li>
            <li><a href="../templates/AdminDB.html"><i class="fas fa-chart-bar"></i> <span>Dashboard</span></a></li>
            <li class="dropdown">
                <a href="#" class="dropdown-btn">
                    <i class="fas fa-graduation-cap"></i> <span>Management</span>
                    <i class="fas fa-chevron-down" style="margin-left: auto;"></i>
                </a>
                <ul class="dropdown-content">
                    <li><a href="../templates/programs.html"><i class="fas fa-scroll"></i> <span>Programs</span></a></li>
                    <li><a href="../templates/schedule.html"><i class="fas fa-calendar-check"></i> <span>Faculty Member Schedules</span></a></li>
                    <li><a href="../templates/classsched.html"><i class="fas fa-calendar-alt"></i> <span>Class Schedules</span></a></li>                
                </ul>
            </li>
            <li><a href="../templates/FacultyDB.html"><i class="fas fa-chalkboard-teacher"></i> <span>Faculty Management</span></a></li>
            <li><a href="../templates/StudentDB.html"><i class="fas fa-user-graduate"></i> <span>Students Management</span></a></li>
            <li><a href="../templates/settings.html"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
            <li><a href="#"><i class="fas fa-sign-out-alt"></i> <span>Sign out</span></a></li>
        </ul>
    </aside>

    <script>
        function initSidebar() {
            document.querySelectorAll(".dropdown-btn").forEach(btn => {
                btn.addEventListener("click", function(e) {
                    e.preventDefault();
                    const content = this.nextElementSibling;
                    content.style.display = (content.style.display === 'block') ? 'none' : 'block';
                });
            });

            const currentPath = window.location.pathname;
            document.querySelectorAll('.nav-items a').forEach(link => {
                const linkPath = link.getAttribute('href').replace('../Admin', '');
                if (currentPath.includes(linkPath) && linkPath !== '#') {
                    link.classList.add('active');
                    const dropdown = link.closest('.dropdown-content');
                    if (dropdown) dropdown.style.display = 'block';
                }
            });
        }

        if (document.readyState !== 'loading') {
            initSidebar();
        } else {
            document.addEventListener('DOMContentLoaded', initSidebar);
        }
    </script>
</body>
</html>
    </script>
</body>
</html>
