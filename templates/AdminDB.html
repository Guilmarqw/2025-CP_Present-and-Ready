<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/AdminDB.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <h2>Dashboard</h2>
        </div>
        
        <div class="dashboard-content">
            <h3>Overview</h3>
            
            <div class="stats-container">
                                <a href="../students/student.html" class="stat-card students">
                    <h4>Total Students</h4>
                    <div class="number">356</div>
                </a>
                <a href="../instructors/instructors.html" class="stat-card instructors">
                    <h4>Instructors</h4>
                    <div class="number">18</div>
                </a>

                <a href="../students/student.html" class="stat-card cs-students">
                    <h4>CS Students</h4>
                    <div class="number">124</div>
                </a>
                
                <a href="../students/student.html" class="stat-card it-students">
                    <h4>IT Students</h4>
                    <div class="number">156</div>
                </a>
                
                <a href="../students/student.html" class="stat-card act-students">
                    <h4>ACT Students</h4>
                    <div class="number">76</div>
                </a>

            </div>
            
            <h3>Recent Activity</h3>
            <p>System is running smoothly. No issues reported.</p>
        </div>
    </main>

    <script>
        // Load sidebar with correct path
        fetch('../templates/sidebar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;
                
                // Fix navigation paths after sidebar loads
                document.querySelectorAll('#sidebar-container .nav-items a').forEach(link => {
                    // Convert relative paths to correct module paths
                    if (!link.getAttribute('href').startsWith('http') && !link.getAttribute('href').startsWith('#')) {
                        link.href = '../' + link.getAttribute('href');
                    }
                });

                // Initialize dropdown functionality
                document.querySelectorAll(".dropdown-btn").forEach(btn => {
                    btn.addEventListener("click", function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        // Close all other dropdowns first
                        document.querySelectorAll('.dropdown-content').forEach(content => {
                            if (content !== this.nextElementSibling) {
                                content.style.display = 'none';
                            }
                        });

                        // Toggle current dropdown
                        const content = this.nextElementSibling;
                        if (content) {
                            content.style.display = content.style.display === 'block' ? 'none' : 'block';
                        }
                    });
                });

                // Close dropdowns when clicking outside
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.dropdown')) {
                        document.querySelectorAll('.dropdown-content').forEach(content => {
                            content.style.display = 'none';
                        });
                    }
                });

                // Handle active state
                const currentPath = window.location.pathname;
                document.querySelectorAll('.nav-items a').forEach(link => {
                    const linkPath = link.getAttribute('href');
                    if (currentPath.includes(linkPath) && linkPath !== '#') {
                        link.classList.add('active');
                        // If link is in dropdown, show parent dropdown
                        const dropdown = link.closest('.dropdown-content');
                        if (dropdown) {
                            dropdown.style.display = 'block';
                        }
                    }
                });
            });
        
    </script>
</body>
</html>
