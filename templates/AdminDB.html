<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='AdminDB.css') }}">
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <h2>Dashboard</h2>
        </div>
        
        <div class="dashboard-content">
            <h3>Overview</h3>
            
            <div class="stats-container">
                <a href="/StudentDB" class="stat-card students">
                    <h4>Total Students</h4>
                    <div class="number">356</div>
                </a>
                <a href="/FacultyDB" class="stat-card faculty">
                    <h4>Faculty Members</h4>
                    <div class="number">18</div>
                </a>

                <a href="/StudentDB" class="stat-card cs-students">
                    <h4>CS Students</h4>
                    <div class="number">124</div>
                </a>

                <a href="/StudentDB" class="stat-card it-students">
                    <h4>IT Students</h4>
                    <div class="number">156</div>
                </a>

                <a href="/StudentDB" class="stat-card act-students">
                    <h4>ACT Students</h4>
                    <div class="number">76</div>
                </a>

            </div>
            
            <h3>Recent Activity</h3>
            <p>System is running smoothly. No issues reported.</p>
        </div>
    </main>

 <script>
    console.log('Starting sidebar fetch...');
    
    // Load sidebar with error handling
    fetch('/sidebar')
        .then(response => {
            console.log('Fetch response status:', response.status);
            console.log('Fetch response URL:', response.url);
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
        })
        .then(html => {
            console.log('Sidebar HTML received, length:', html.length);
            console.log('First 100 chars:', html.substring(0, 100));
            
            document.getElementById('sidebar-container').innerHTML = html;
            
            // Initialize dropdown functionality
            document.querySelectorAll(".dropdown-btn").forEach(btn => {
                btn.addEventListener("click", function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Close all other dropdowns first
                    document.querySelectorAll('.dropdown-content').forEach(content => {
                        if (content !== this.nextElementSibling) {
                            content.style.display = 'none';
                        }
                    });

                    // Toggle current dropdown
                    const content = this.nextElementSibling;
                    if (content) {
                        content.style.display = content.style.display === 'block' ? 'none' : 'block';
                    }
                });
            });

            // Close dropdowns when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.dropdown')) {
                    document.querySelectorAll('.dropdown-content').forEach(content => {
                        content.style.display = 'none';
                    });
                }
            });

            // Handle active state
            const currentPath = window.location.pathname;
            document.querySelectorAll('.nav-items a').forEach(link => {
                const linkPath = link.getAttribute('href');
                if (currentPath.includes(linkPath) && linkPath !== '#') {
                    link.classList.add('active');
                    // If link is in dropdown, show parent dropdown
                    const dropdown = link.closest('.dropdown-content');
                    if (dropdown) {
                        dropdown.style.display = 'block';
                    }
                }
            });
        })
        .catch(error => {
            console.error('Sidebar fetch failed:', error);
            console.error('Error details:', error.message);
            // Show error in sidebar container for debugging
            document.getElementById('sidebar-container').innerHTML = `
                <div style="color: red; padding: 20px;">
                    <h3>Sidebar Error</h3>
                    <p>Failed to load sidebar: ${error.message}</p>
                    <p>Check console for details</p>
                </div>
            `;
        });
</script>
</body>
</html>
