<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='settings.css') }}">
  <link rel="stylesheet" href="../static/settings.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='AdminDB.css') }}">
</head>
<body>
  <div class="header">
    <div class="header-left">
      <img src="../static/images/logo.png" alt="University Logo" class="logo">
      <div class="title">Admin Side</div>
    </div>
    <div class="header-right">
      <div class="user-info">
        <div class="name">Guilmar Acabo Quimba</div>
        <div class="role">Admin</div>
      </div>
      <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="User" class="profile-pic" onclick="toggleDropdown()">
      <div class="dropdown" id="dropdown">
        <a href="#" onclick="showAccountSettings()">Account Settings</a>
        <a href="#">Go back to Session</a>
        <a href="#">Logout</a>
      </div>
    </div>
  </div>

  <div class="main-content" id="account-settings">
    <div class="card">
      <div class="card-header">
        <h2>Personal Information</h2>
        <div class="buttons">
          <button class="edit-btn">Edit</button>
          <button class="logout-btn">Logout</button>
        </div>
      </div>

      <div class="profile-section">
        <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="Profile">
        <div class="fullname">Guilmar Acabo Quimba</div>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <label>FIRST NAME</label>
          <div>Guilmar</div>
        </div>
        <div class="info-item">
          <label>MIDDLE NAME</label>
          <div>Acabo</div>
        </div>
        <div class="info-item">
          <label>LAST NAME</label>
          <div>Quimba</div>
        </div>
        <div class="info-item">
          <label>COURSE</label>
          <div>BS Computer Science</div>
        </div>
        <div class="info-item">
          <label>YEAR AND SECTION</label>
          <div>BSCS 1A</div>
        </div>
        <div class="info-item">
          <label>STUDENT ID</label>
          <div>2022-00954</div>
        </div>
        <div class="info-item">
          <label>EMAIL</label>
          <div><a href="mailto:guilmar12@example.com">guilmar12@example.com</a></div>
        </div>
      </div>
    </div>

    <div class="security-card">
      <h3>Account Security</h3>
      <div class="security-item">
        <div>
          <label>Password</label>
          <div>*******</div>
        </div>
        <button class="change-btn">Change Password</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Personal Information</h3>
        <span class="close" onclick="closeModal()">&times;</span>
      </div>
      <form id="editForm">
        <div class="modal-grid">
          <div class="modal-item">
            <label>First Name</label>
            <input type="text" id="editFirstName" value="Guilmar" required />
          </div>
          <div class="modal-item">
            <label>Middle Name</label>
            <input type="text" id="editMiddleName" value="Acabo" />
          </div>
          <div class="modal-item">
            <label>Last Name</label>
            <input type="text" id="editLastName" value="Quimba" required />
          </div>
          <div class="modal-item">
            <label>Course</label>
            <input type="text" id="editCourse" value="BS Computer Science" required />
          </div>
          <div class="modal-item">
            <label>Year & Section</label>
            <input type="text" id="editYearSection" value="BSCS 1A" required />
          </div>
          <div class="modal-item">
            <label>Student ID</label>
            <input type="text" id="editStudentId" value="2022-00954" readonly />
          </div>
          <div class="modal-item">
            <label>Email</label>
            <input type="email" id="editEmail" value="guilmar12@example.com" required />
          </div>
        </div>
        <div class="modal-buttons">
          <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="save-btn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const dropdown = document.getElementById("dropdown");
    const profilePic = document.querySelector(".profile-pic");
    const modal = document.getElementById("editModal");
    const editBtn = document.querySelector(".edit-btn");

    // Toggle dropdown
    function toggleDropdown() {
      dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
    }

    // Close dropdown/modal when clicking outside
    window.addEventListener("click", function(e) {
      if (!profilePic.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.style.display = "none";
      }
      if (modal.style.display === "block" && !document.querySelector('.modal-content').contains(e.target)) {
        closeModal();
      }
    });

    // Scroll to account settings
    function showAccountSettings() {
      dropdown.style.display = "none";
      document.getElementById("account-settings").scrollIntoView({ behavior: "smooth" });
    }

    // Open modal
    editBtn.addEventListener("click", function() {
      modal.style.display = "block";
    });

    // Close modal
    function closeModal() {
      modal.style.display = "none";
    }

    // Handle form submit
    document.getElementById("editForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const firstName = document.getElementById("editFirstName").value.trim();
      const middleName = document.getElementById("editMiddleName").value.trim();
      const lastName = document.getElementById("editLastName").value.trim();
      const course = document.getElementById("editCourse").value.trim();
      const yearSection = document.getElementById("editYearSection").value.trim();
      const email = document.getElementById("editEmail").value.trim();

      // Update displayed info
      const infoItems = document.querySelectorAll(".info-item");
      infoItems[0].children[1].textContent = firstName;
      infoItems[1].children[1].textContent = middleName || "-";
      infoItems[2].children[1].textContent = lastName;
      infoItems[3].children[1].textContent = course;
      infoItems[4].children[1].textContent = yearSection;
      infoItems[6].children[1].innerHTML = `<a href="mailto:${email}">${email}</a>`;
      document.querySelector(".fullname").textContent = [firstName, middleName, lastName].filter(Boolean).join(" ");

      closeModal();
      alert("Changes saved successfully!");
    });
  </script>
</body>
</html>
