<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='subject.css') }}">
    <link rel="stylesheet" href="../static/subject.css">
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <h2>Curriculum Management System</h2>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search...">
            </div>
        </div>
        
        <div class="dashboard-content">
            <h3>Curriculum Overview</h3>
            
            <div class="stats-container">
                <div class="stat-card" data-department="it">
                    <h4>Information Technology</h4>
                    <div class="number">4 Years</div>
                    <div class="period">2022-2025</div>
                </div>
                
                <div class="stat-card cs" data-department="cs">
                    <h4>Computer Science</h4>
                    <div class="number">4 Years</div>
                    <div class="period">2023-2026</div>
                </div>
                
                <div class="stat-card act" data-department="act">
                    <h4>Associate in Computer Technology</h4>
                    <div class="number">4 Years</div>
                    <div class="period">2022-2025</div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="add-curriculum-btn">
                    <i class="fas fa-plus"></i> Add New Curriculum
                </button>
            </div>
        </div>

        <div class="dashboard-content">
            <h3>Current Curriculum: <span id="current-curriculum-name">Information Technology 2022-2025</span></h3>
            
            <div class="curriculum-controls">
                <div class="control-group">
                    <label for="year-level">Year Level</label>
                    <select id="year-level">
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="semester">Semester</label>
                    <select id="semester">
                        <option value="1">1st Semester</option>
                        <option value="2">2nd Semester</option>
                    </select>
                </div>
            </div>
            
            <table class="subjects-table">
                <thead>
                    <tr>
                        <th width="15%">Code</th>
                        <th width="70%">Subject Name</th>
                        <th width="15%">Units</th>
                    </tr>
                </thead>
                <tbody id="subjects-body">
                    <!-- Subjects will be populated here -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add Curriculum Modal -->
    <div class="modal" id="add-curriculum-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Curriculum</h3>
                <span class="close">&times;</span>
            </div>
            <form id="add-curriculum-form">
                <div class="form-group">
                    <label for="curriculum-name">Curriculum Name</label>
                    <input type="text" id="curriculum-name" required>
                </div>
                
                <div class="form-group">
                    <label for="curriculum-department">Department</label>
                    <select id="curriculum-department" required>
                        <option value="">Select Department</option>
                        <option value="it">Information Technology</option>
                        <option value="cs">Computer Science</option>
                        <option value="act">Associate in Computer Technology</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="curriculum-period">Curriculum Period</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="curriculum-start-year" min="2020" max="2030" placeholder="Start Year" required>
                        <span style="line-height: 40px;">-</span>
                        <input type="number" id="curriculum-end-year" min="2020" max="2030" placeholder="End Year" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="curriculum-duration">Program Duration (Years)</label>
                    <input type="number" id="curriculum-duration" min="1" max="6" value="4" required>
                </div>
                
                <div class="form-group">
                    <label for="curriculum-description">Description</label>
                    <textarea id="curriculum-description"></textarea>
                </div>
                
                <div class="subject-inputs">
                    <h4>Subjects</h4>
                    
                    <div id="subjects-container">
                        <div class="subject-item">
                            <input type="text" class="subject-code" placeholder="Code" required>
                            <input type="text" class="subject-name" placeholder="Subject Name" required>
                            <input type="number" class="subject-units" placeholder="Units" min="1" max="6" required>
                            <button type="button" class="remove-subject">&times;</button>
                        </div>
                    </div>
                    
                    <button type="button" class="add-subject-btn" id="add-subject-btn">
                        <i class="fas fa-plus"></i> Add Subject
                    </button>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="cancel-curriculum">Cancel</button>
                    <button type="submit" class="btn btn-success">Add Curriculum</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Sample curriculum data
        const curriculumData = {
            "it-2022-2025": {
                name: "Information Technology 2022-2025",
                department: "it",
                period: "2022-2025",
                duration: 4,
                1: {
                    1: [
                        { code: "IT101", name: "Introduction to Computing", units: 3 },
                        { code: "IT102", name: "Computer Programming 1", units: 3 },
                        { code: "MATH101", name: "College Algebra", units: 3 },
                        { code: "ENG101", name: "Communication Skills 1", units: 3 },
                        { code: "FIL101", name: "Komunikasyon sa Akademikong Filipino", units: 3 },
                        { code: "PE101", name: "Physical Fitness", units: 2 },
                        { code: "NSTP1", name: "National Service Training Program 1", units: 3 }
                    ],
                    2: [
                        { code: "IT103", name: "Computer Programming 2", units: 3 },
                        { code: "IT104", name: "Discrete Mathematics", units: 3 },
                        { code: "MATH102", name: "Trigonometry", units: 3 },
                        { code: "ENG102", name: "Communication Skills 2", units: 3 },
                        { code: "FIL102", name: "Pagbasa at Pagsulat Tungo sa Pananaliksik", units: 3 },
                        { code: "PE102", name: "Rhythmic Activities", units: 2 },
                        { code: "NSTP2", name: "National Service Training Program 2", units: 3 }
                    ]
                },
                2: {
                    1: [
                        { code: "IT201", name: "Data Structures and Algorithms", units: 3 },
                        { code: "IT202", name: "Object-Oriented Programming", units: 3 },
                        { code: "MATH203", name: "Probability and Statistics", units: 3 },
                        { code: "SCI201", name: "Physics for IT", units: 4 },
                        { code: "SOCSCI201", name: "Philippine History", units: 3 },
                        { code: "PE201", name: "Individual/Dual Sports", units: 2 }
                    ],
                    2: [
                        { code: "IT203", name: "Web Development", units: 3 },
                        { code: "IT204", name: "Database Management Systems", units: 3 },
                        { code: "IT205", name: "Networking 1", units: 3 },
                        { code: "MATH204", name: "Calculus", units: 3 },
                        { code: "SOCSCI202", name: "Society and Culture", units: 3 },
                        { code: "PE202", name: "Team Sports", units: 2 }
                    ]
                }
            },
            "cs-2023-2026": {
                name: "Computer Science 2023-2026",
                department: "cs",
                period: "2023-2026",
                duration: 4,
                1: {
                    1: [
                        { code: "CS101", name: "Introduction to Programming", units: 3 },
                        { code: "CS102", name: "Computer Fundamentals", units: 3 },
                        { code: "MATH101", name: "College Algebra", units: 3 },
                        { code: "ENG101", name: "Communication Skills 1", units: 3 }
                    ],
                    2: [
                        { code: "CS103", name: "Data Structures", units: 3 },
                        { code: "CS104", name: "Discrete Mathematics", units: 3 },
                        { code: "MATH102", name: "Trigonometry", units: 3 },
                        { code: "ENG102", name: "Communication Skills 2", units: 3 }
                    ]
                }
            },
            "act-2022-2025": {
                name: "Associate in Computer Technology 2022-2025",
                department: "act",
                period: "2022-2025",
                duration: 4,
                1: {
                    1: [
                        { code: "ACT101", name: "Introduction to Computing", units: 3 },
                        { code: "ACT102", name: "Computer Programming 1", units: 3 },
                        { code: "ENG101", name: "Communication Skills 1", units: 3 }
                    ],
                    2: [
                        { code: "ACT103", name: "Computer Programming 2", units: 3 },
                        { code: "ACT104", name: "Database Management", units: 3 },
                        { code: "ENG102", name: "Communication Skills 2", units: 3 }
                    ]
                }
            }
        };

        // Initialize with IT curriculum data
        let currentCurriculum = 'it-2022-2025';
        let currentYear = '1';
        let currentSemester = '1';
        
        // DOM elements
        const yearLevelSelect = document.getElementById('year-level');
        const semesterSelect = document.getElementById('semester');
        const currentCurriculumName = document.getElementById('current-curriculum-name');
        const subjectsBody = document.getElementById('subjects-body');
        const addCurriculumBtn = document.getElementById('add-curriculum-btn');
        const addCurriculumModal = document.getElementById('add-curriculum-modal');
        const addCurriculumForm = document.getElementById('add-curriculum-form');
        const closeModalBtn = document.querySelector('.close');
        const cancelCurriculumBtn = document.getElementById('cancel-curriculum');
        const statCards = document.querySelectorAll('.stat-card');
        const addSubjectBtn = document.getElementById('add-subject-btn');
        const subjectsContainer = document.getElementById('subjects-container');
        
        // Function to update the displayed curriculum
        function updateCurriculum() {
            currentYear = yearLevelSelect.value;
            currentSemester = semesterSelect.value; // Changed from semester tabs to semester select
            
            // Get the subjects for the current selection
            const subjects = curriculumData[currentCurriculum] && 
                            curriculumData[currentCurriculum][currentYear] && 
                            curriculumData[currentCurriculum][currentYear][currentSemester] || [];
            
            // Update the curriculum name
            currentCurriculumName.textContent = curriculumData[currentCurriculum].name;
            
            // Clear the table body
            subjectsBody.innerHTML = '';
            
            // Add each subject to the table
            if (subjects.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="3" style="text-align: center; padding: 20px;">
                        No subjects found for this selection.
                    </td>
                `;
                subjectsBody.appendChild(row);
            } else {
                subjects.forEach((subject, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${subject.code}</td>
                        <td>${subject.name}</td>
                        <td>${subject.units}</td>
                    `;
                    subjectsBody.appendChild(row);
                });
            }
        }
        
        // Function to show modal
        function showModal() {
            addCurriculumModal.style.display = 'flex';
        }
        
        // Function to hide modal
        function hideModal() {
            addCurriculumModal.style.display = 'none';
            addCurriculumForm.reset();
            // Reset subject inputs to one
            subjectsContainer.innerHTML = `
                <div class="subject-item">
                    <input type="text" class="subject-code" placeholder="Code" required>
                    <input type="text" class="subject-name" placeholder="Subject Name" required>
                    <input type="number" class="subject-units" placeholder="Units" min="1" max="6" required>
                    <button type="button" class="remove-subject">&times;</button>
                </div>
            `;
            initRemoveSubjectButtons();
        }
        
        // Function to handle form submission
        function handleFormSubmit(e) {
            e.preventDefault();
            
            // Get form values
            const name = document.getElementById('curriculum-name').value;
            const department = document.getElementById('curriculum-department').value;
            const startYear = document.getElementById('curriculum-start-year').value;
            const endYear = document.getElementById('curriculum-end-year').value;
            const duration = document.getElementById('curriculum-duration').value;
            const description = document.getElementById('curriculum-description').value;
            
            // Get subject data
            const subjectItems = subjectsContainer.querySelectorAll('.subject-item');
            const subjects = [];
            
            subjectItems.forEach(item => {
                const code = item.querySelector('.subject-code').value;
                const name = item.querySelector('.subject-name').value;
                const units = item.querySelector('.subject-units').value;
                
                if (code && name && units) {
                    subjects.push({ code, name, units: parseInt(units) });
                }
            });
            
            // In a real application, you would send this data to a server
            console.log('New Curriculum:', { 
                name, 
                department, 
                period: `${startYear}-${endYear}`,
                duration, 
                description,
                subjects 
            });
            
            // Show success message
            alert('Curriculum added successfully!');
            
            // Hide modal
            hideModal();
        }
        
        // Function to handle curriculum card click
        function handleCardClick() {
            const department = this.dataset.department;
            
            // Find the curriculum for this department
            for (const key in curriculumData) {
                if (curriculumData[key].department === department) {
                    currentCurriculum = key;
                    updateCurriculum();
                    break;
                }
            }
        }
        
        // Function to add a subject input field
        function addSubjectInput() {
            const subjectItem = document.createElement('div');
            subjectItem.className = 'subject-item';
            subjectItem.innerHTML = `
                <input type="text" class="subject-code" placeholder="Code" required>
                <input type="text" class="subject-name" placeholder="Subject Name" required>
                <input type="number" class="subject-units" placeholder="Units" min="1" max="6" required>
                <button type="button" class="remove-subject">&times;</button>
            `;
            subjectsContainer.appendChild(subjectItem);
            initRemoveSubjectButtons();
        }
        
        // Function to initialize remove subject buttons
        function initRemoveSubjectButtons() {
            const removeButtons = subjectsContainer.querySelectorAll('.remove-subject');
            removeButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Don't remove if there's only one subject input
                    if (subjectsContainer.querySelectorAll('.subject-item').length > 1) {
                        this.parentElement.remove();
                    }
                });
            });
        }
        
        // Event listeners
        yearLevelSelect.addEventListener('change', updateCurriculum);
        semesterSelect.addEventListener('change', function() {
            currentSemester = this.value;
            updateCurriculum();
        });
        
        addCurriculumBtn.addEventListener('click', showModal);
        closeModalBtn.addEventListener('click', hideModal);
        cancelCurriculumBtn.addEventListener('click', hideModal);
        addCurriculumForm.addEventListener('submit', handleFormSubmit);
        addSubjectBtn.addEventListener('click', addSubjectInput);
        
        // Close modal when clicking outside the modal content
        window.addEventListener('click', function(e) {
            if (e.target === addCurriculumModal) {
                hideModal();
            }
        });
        
        // Add event listeners to curriculum cards
        statCards.forEach(card => {
            card.addEventListener('click', handleCardClick);
        });
        
        // Initialize remove subject buttons
        initRemoveSubjectButtons();
        
        // Initialize the curriculum display
        updateCurriculum();

        // Load sidebar with correct path
        fetch('../templates/sidebar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;
                // Fix navigation paths after sidebar loads
                document.querySelectorAll('#sidebar-container .nav-items a').forEach(link => {
                    // Convert relative paths to correct module paths
                    if (!link.getAttribute('href').startsWith('http') && !link.getAttribute('href').startsWith('#')) {
                        link.href = '../' + link.getAttribute('href');
                    }
                });
            });
    </script>
</body>
</html>
