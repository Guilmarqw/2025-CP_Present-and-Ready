<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMSU Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: white;
    }

    .login-container {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
      transition: all 0.3s ease-in-out;
    }

    h2 {
      margin-bottom: 1.5rem;
      color: #800000;
    }

    .input-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      color: #444;
    }

    .input-group input {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: #800000;
    }

    .btn {
      background: #800000;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #a83232;
    }

    .hidden {
      display: none;
    }

    .error {
      color: red;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>WMSU Login</h2>

    <!-- Step 1: Email -->
    <div id="step1">
      <div class="input-group">
        <label for="email">WMSU Email</label>
        <input type="email" id="email" placeholder="yourname@wmsu.edu.ph">
      </div>
      <p id="emailError" class="error hidden">Please enter a valid WMSU email.</p>
      <button class="btn" onclick="goToPin()">Next</button>
    </div>

    <!-- Step 2: PIN -->
    <div id="step2" class="hidden">
      <div class="input-group">
        <label for="pin">Enter 6-Digit PIN</label>
        <input type="password" id="pin" placeholder="6-digit PIN" maxlength="6" inputmode="numeric">
      </div>
      <p id="pinError" class="error hidden">PIN must be exactly 6 digits.</p>
      <button class="btn" onclick="login()">Login</button>
    </div>
  </div>

  <script>
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const emailInput = document.getElementById('email');
    const pinInput = document.getElementById('pin');
    const emailError = document.getElementById('emailError');
    const pinError = document.getElementById('pinError');

    function goToPin() {
      const email = emailInput.value.trim();
      const emailRegex = /^[a-zA-Z0-9._%+-]+@wmsu\.edu\.ph$/;

      if (!emailRegex.test(email)) {
        emailError.classList.remove('hidden');
      } else {
        emailError.classList.add('hidden');
        step1.classList.add('hidden');
        step2.classList.remove('hidden');
      }
    }

    function login() {
      const pin = pinInput.value.trim();

      if (pin.length !== 6 || isNaN(pin)) {
        pinError.classList.remove('hidden');
      } else {
        pinError.classList.add('hidden');
        // Simulate redirect to dashboard
        window.location.href = "dashboard.html";
      }
    }
  </script>
</body>
</html>
