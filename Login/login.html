<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMSU Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: white;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
      transition: all 0.3s ease-in-out;
    }

    h2 {
      margin-bottom: 1.5rem;
      color: #800000;
    }

    .input-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      color: #444;
    }

    .input-group input {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: #800000;
    }

    .btn {
      background: #800000;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #a83232;
    }

    .forgot-btn, .back-btn {
      background: none;
      border: none;
      color: #800000;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      cursor: pointer;
      width: 100%;
      text-align: center;
      text-decoration: underline;
    }

    .forgot-btn:hover, .back-btn:hover {
      color: #a83232;
    }

    .error {
      color: red;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginForm">
      <h2>WMSU Login</h2>
      <div class="input-group">
        <label for="email">WMSU Email</label>
        <input type="email" id="email" placeholder="yourname@wmsu.edu.ph">
      </div>
      <p id="emailError" class="error" style="display: none;">Please enter a valid WMSU email.</p>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
      </div>
      <p id="passwordError" class="error" style="display: none;">Password cannot be empty.</p>

      <button class="btn" onclick="login()">Login</button>
      <button class="forgot-btn" onclick="showResetForm()">Forgot Password?</button>
    </div>

    <div id="resetForm" class="hidden">
      <h2>Reset Password</h2>
      <div class="input-group">
        <label for="resetEmail">WMSU Email</label>
        <input type="email" id="resetEmail" placeholder="yourname@wmsu.edu.ph">
      </div>
      <p id="resetEmailError" class="error" style="display: none;">Please enter a valid WMSU email.</p>
      <button class="btn" onclick="submitResetPassword()">Send Reset Link</button>
      <button class="back-btn" onclick="showLoginForm()">Back to Login</button>
    </div>
  </div>

  <script>
    function login() {
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const emailRegex = /^[a-zA-Z0-9._%+-]+@wmsu\.edu\.ph$/;

      let valid = true;

      if (!emailRegex.test(email)) {
        emailError.style.display = 'block';
        valid = false;
      } else {
        emailError.style.display = 'none';
      }

      if (password === '') {
        passwordError.style.display = 'block';
        valid = false;
      } else {
        passwordError.style.display = 'none';
      }

      if (valid) {
        // Simulate redirect to dashboard after validation
        window.location.href = "../Admin/dashboard/dashboard.html";
      }
    }

    function showResetForm() {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('resetForm').classList.remove('hidden');
    }

    function showLoginForm() {
      document.getElementById('resetForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('resetEmail').value = '';
      document.getElementById('resetEmailError').style.display = 'none';
    }

    function submitResetPassword() {
      const resetEmailInput = document.getElementById('resetEmail');
      const resetEmailError = document.getElementById('resetEmailError');
      const email = resetEmailInput.value.trim();
      const emailRegex = /^[a-zA-Z0-9._%+-]+@wmsu\.edu\.ph$/;

      if (!emailRegex.test(email)) {
        resetEmailError.style.display = 'block';
      } else {
        resetEmailError.style.display = 'none';
        alert(`A password reset link has been sent to ${email}. Please check your email.`);
        showLoginForm();
      }
    }
  </script>
</body>
</html>
