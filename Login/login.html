<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMSU Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: white;
    }

    .login-container {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
      transition: all 0.3s ease-in-out;
    }

    h2 {
      margin-bottom: 1.5rem;
      color: #800000;
    }

    .input-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      color: #444;
    }

    .input-group input {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: #800000;
    }

    .btn {
      background: #800000;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #a83232;
    }

    .error {
      color: red;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>WMSU Login</h2>

    <div class="input-group">
      <label for="email">WMSU Email</label>
      <input type="email" id="email" placeholder="yourname@wmsu.edu.ph">
    </div>
    <p id="emailError" class="error" style="display: none;">Please enter a valid WMSU email.</p>

    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>
    <p id="passwordError" class="error" style="display: none;">Password cannot be empty.</p>

    <button class="btn" onclick="login()">Login</button>
  </div>

  <script>
    function login() {
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const emailRegex = /^[a-zA-Z0-9._%+-]+@wmsu\.edu\.ph$/;

      let valid = true;

      if (!emailRegex.test(email)) {
        emailError.style.display = 'block';
        valid = false;
      } else {
        emailError.style.display = 'none';
      }

      if (password === '') {
        passwordError.style.display = 'block';
        valid = false;
      } else {
        passwordError.style.display = 'none';
      }

      if (valid) {
        // Simulate redirect to dashboard after validation
        window.location.href = "../Admin/dashboard/dashboard.html";
      }
    }
  </script>
</body>
</html>
